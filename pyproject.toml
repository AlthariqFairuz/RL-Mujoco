[project]
name = "rl"
version = "0.1.0"
description = "A collection of reinforcement learning experiments in MuJoCo simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]>=1.3.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.14.0",
    "pandas>=3.0.6",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["env"]  # <project>/<task>/env.py, imported by the scripts next to it
